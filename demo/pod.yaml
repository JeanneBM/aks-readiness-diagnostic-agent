apiVersion: v1
kind: Pod
metadata:
  name: readiness-demo
  namespace: readiness-lab
  labels:
    app: readiness-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: readiness-demo:local
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
      env:
        - name: PORT
          value: '8080'
        - name: READY_PATH
          value: /ready
        - name: SIMULATE_DEPENDENCY_FAILURE
          value: 'false'
      readinessProbe:
        httpGet:
          path: /ready
          port: http
        periodSeconds: 3
        failureThreshold: 2
      livenessProbe:
        httpGet:
          path: /live
          port: http
        periodSeconds: 10
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 96Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
