name: security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: matrix.language == 'go'
        with:
          go-version-file: lab/go/go.mod
          cache: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build Go lab under CodeQL tracing
        if: matrix.language == 'go'
        working-directory: lab/go
        run: go build ./...
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
  repository-scan:
    name: Dependencies and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan dependency manifests (fail on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          cache: 'false'
      - name: Scan current tree for secrets (all severities)
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          format: table
          cache: 'false'
  security-contracts:
    name: RBAC and workflow contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_security_contracts.py -v
  rbac-enforcement:
    name: RBAC allowed and denied operations
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - name: Create disposable local cluster and apply example RBAC
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          "$(go env GOPATH)/bin/kind" create cluster --name readiness-security --wait 120s
          kubectl --context kind-readiness-security create namespace readiness-diag-lab
          kubectl --context kind-readiness-security apply -f k8s/collector-readonly.json
      - name: Verify permitted reads and denied operations
        run: bash scripts/verify-collector-rbac.sh
      - name: Delete disposable cluster
        if: always()
        run: |
          if [[ -x "$(go env GOPATH)/bin/kind" ]]; then
            "$(go env GOPATH)/bin/kind" delete cluster --name readiness-security
          fi
