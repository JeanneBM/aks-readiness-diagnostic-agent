name: offline-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: readiness-agent evaluate --cases data/dev --variants A1 --output .local/ci-replay
  native-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: lab/go/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python tools/capture_go_logs.py --output .local/go-capture
      - run: python -m unittest discover -s tests -p test_go_logs.py -v
        env:
          READINESS_GO_CAPTURE: .local/go-capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-go-process-logs
          path: |
            .local/go-capture/*.log
            .local/go-capture/*.json
          include-hidden-files: true
