[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aks-readiness-diagnostic-agent"
version = "0.1.0"
description = "Read-only, evidence-backed readiness diagnosis with a deterministic baseline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
readiness-agent = "readiness_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
